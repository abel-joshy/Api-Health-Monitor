name: API Health Monitor CI

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------
      # Build Backend
      # -----------------------

      - name: Build Backend Image
        run: |
          docker build \
            -t abeljoshy/api-health-backend:latest \
            ./backend

      - name: Push Backend Image
        run: |
          docker push abeljoshy/api-health-backend:latest

      # -----------------------
      # Build Frontend
      # -----------------------

      - name: Build Frontend Image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://3.110.106.214:8000 \
            -t abeljoshy/api-health-frontend:latest \
            ./frontend

      - name: Push Frontend Image
        run: |
          docker push abeljoshy/api-health-frontend:latest